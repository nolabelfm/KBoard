<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Konqi</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:   #e8a020;
      --amber:  #f5c842;
      --ember:  #c96a10;
      --bg:     #090909;
      --surface:#0e0e0e;
      --edge:   rgba(232, 160, 32, 0.18);
      --muted:  #5a5a5a;
      --text:   #f0ece4;
      --sans:   'Syne', sans-serif;
      --mono:   'DM Mono', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 40% at 15% 5%,  rgba(200, 100, 10, 0.22) 0%, transparent 65%),
        radial-gradient(ellipse 40% 50% at 88% 92%, rgba(232, 160, 32, 0.16) 0%, transparent 60%),
        radial-gradient(ellipse 30% 30% at 50% 50%, rgba(245, 200, 66, 0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(232,160,32,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232,160,32,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      padding: 48px 44px 44px;
      background: rgba(12, 12, 12, 0.92);
      border: 1px solid rgba(232, 160, 32, 0.14);
      border-radius: 4px;
      backdrop-filter: blur(24px);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 12%; right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.6;
    }

    .eyebrow {
      margin-bottom: 36px;
    }

    .logo-text {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.22em;
      color: var(--muted);
      text-transform: uppercase;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #f0ece4 30%, #c07010);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .divider {
      width: 32px;
      height: 2px;
      background: linear-gradient(90deg, var(--gold), var(--amber));
      margin-bottom: 32px;
      border-radius: 1px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 3px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      letter-spacing: 0.01em;
    }

    input:focus {
      border-color: rgba(232, 160, 32, 0.5);
      background: rgba(232, 160, 32, 0.03);
    }

    input::placeholder {
      color: rgba(255,255,255,0.15);
      font-size: 13px;
    }

    .btn {
      width: 100%;
      margin-top: 28px;
      padding: 14px;
      position: relative;
      background: linear-gradient(135deg, #c96a10, #e8a020 60%, #f5c842);
      border: none;
      border-radius: 3px;
      color: #0a0600;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      overflow: hidden;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
      pointer-events: none;
    }

    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.992); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .status {
      margin-top: 20px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--muted);
      min-height: 16px;
      text-align: center;
      line-height: 1.5;
    }

    .status.error { color: #c05030; }
    .status.good  { color: #90a050; }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .loading-dot { animation: pulse-dot 1s ease-in-out infinite; display: inline-block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">
      <span class="logo-text">Konqi-bot</span>
    </div>

    <h1>Sign in</h1>
    <div class="divider"></div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
    </div>

    <button class="btn" id="signInBtn">Continue</button>

    <div class="status" id="status"></div>
  </div>

  <script>
    const SUPABASE_URL      = 'https://fzaeyhihqlznfenkyrhv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6YWV5aGlocWx6bmZlbmt5cmh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyODk2MDYsImV4cCI6MjA3Nzg2NTYwNn0.dNA9OSZXqaTXLLcE3TakJhzfHZ9xfy51empFBWGbR7k';

    const client   = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const emailEl  = document.getElementById('email');
    const passEl   = document.getElementById('password');
    const btn      = document.getElementById('signInBtn');
    const statusEl = document.getElementById('status');

    function setStatus(msg, tone = '') {
      statusEl.textContent = msg;
      statusEl.className = 'status ' + tone;
    }

    async function signIn() {
      const email    = emailEl.value.trim();
      const password = passEl.value;
      if (!email || !password) { setStatus('Enter your email and password.', 'error'); return; }

      btn.disabled = true;
      statusEl.innerHTML = '<span class="loading-dot">—</span>';
      statusEl.className = 'status';

      try {
        const { data, error } = await client.auth.signInWithPassword({ email, password });
        if (error) throw error;

        const { data: access, error: accessErr } = await client
          .from('allowed_users')
          .select('can_access')
          .eq('supabase_user_id', data.user.id)
          .maybeSingle();

        if (accessErr) throw accessErr;
        if (!access || !access.can_access) {
          await client.auth.signOut();
          throw new Error('Access denied.');
        }

        setStatus('Authenticated.', 'good');
        setTimeout(() => { window.location.href = '/dashboard'; }, 700);

      } catch (err) {
        setStatus(err.message, 'error');
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', signIn);
    [emailEl, passEl].forEach(el =>
      el.addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); })
    );
  </script>
</body>
</html>
